[test kw]
use_barcode = 0
barcode1 = 1
sn1 = 2
note = 3
barcode2 = 4
sn2 = 5

[foldbacks]
positive battery limit = motoring battery current limit after battery foldbacks
battery i^2t foldback gain = battery I^2t overload foldback gain
low voltage foldback gain = battery low voltage foldback gain
low state of charge foldback gain = Battery low state of charge foldback gain
negative battery limit = regen battery current limit after battery foldbacks
high voltage foldback gain = battery limit high voltage foldback gain
high state of charge foldback gain = high state of charge foldback on battery regen current
motor temperature foldback gain = Motor temperature foldback gain
inverter temperature foldback gain = Inverter (hot and cold) foldback gain (controller temperature)
motoring phase current limit = Maximum motor current after thermal foldbacks applied
regen phase current limit = Maximum motor regen current after thermal foldbacks applied
combined motor foldback = Motor foldback value - multiplied with motoring/regen current pre-foldback to get combined motoring/regen current limits
remote motoring foldback = Remote Motoring Foldback PU
remote regen foldback = Remote Regen Foldback

